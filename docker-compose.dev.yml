services:
  postgres:
    image: postgres:16-alpine
    container_name: cyphire-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: cyphire
      POSTGRES_PASSWORD: YOMjp2c6d857mITU857E4AvNe1eMyEgL
      POSTGRES_DB: cert_verifier
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyphire -d cert_verifier"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: cyphire-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: cyphire_minio
      MINIO_ROOT_PASSWORD: AeNyzlxtGtwHAoUeDugYXGZ30JTQpIoE
    volumes:
      - miniodata:/data
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
